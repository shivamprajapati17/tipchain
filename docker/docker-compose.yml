version: "3.8"

# ─── TipChain — Docker Compose ─────────────────────────────────────────────
# Full-stack deployment with PostgreSQL, Redis, backend API, and frontend.
#
# Usage:
#   docker compose up -d
#   docker compose logs -f

services:
  # ── Database ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tipchain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: tipchain
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Cache ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tipchain-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend API ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: tipchain-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/tipchain?schema=public"
      REDIS_URL: "redis://redis:6379"
      PORT: 4000
      FRONTEND_URL: "http://localhost:3000"
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      SOLANA_NETWORK: ${SOLANA_NETWORK:-devnet}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../apps/web
      dockerfile: ../../docker/Dockerfile.frontend
    container_name: tipchain-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:4000"
      NEXT_PUBLIC_SOLANA_NETWORK: ${SOLANA_NETWORK:-devnet}
      NEXT_PUBLIC_SOLANA_RPC: ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    depends_on:
      - backend

  # ── Reverse Proxy (optional) ──────────────────────────────────────────────
  # Uncomment for production with custom domain
  # nginx:
  #   image: nginx:alpine
  #   container_name: tipchain-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf
  #     - ./ssl:/etc/nginx/ssl
  #   depends_on:
  #     - frontend
  #     - backend

volumes:
  postgres_data:
  redis_data:
