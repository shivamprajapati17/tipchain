services:
  - type: web
    name: tipchain-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx tsc
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://tipchainsolana.vercel.app
      - key: SOLANA_NETWORK
        value: devnet
      - key: SOLANA_RPC_URL
        value: https://api.devnet.solana.com
      # Secrets below are set in the Render dashboard (Settings → Environment),
      # never committed to the repository.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
    healthCheckPath: /health
    autoDeploy: true
